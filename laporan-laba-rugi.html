<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Laba Rugi — SupplierPro</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .report-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 2rem;
        }
        .report-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--gray-100);
        }
        .report-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }
        .report-subtitle {
            color: var(--gray-500);
            font-size: 0.95rem;
        }
        .report-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--gray-50);
            padding: 1rem;
            border-radius: 8px;
        }
        .report-filters {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .report-section {
            margin-bottom: 1.5rem;
        }
        .report-section-title {
            font-weight: 600;
            color: var(--indigo-600);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .report-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            color: var(--gray-700);
            border-bottom: 1px dashed var(--gray-200);
        }
        .report-row.sub-row {
            padding-left: 1.5rem;
            font-size: 0.95rem;
            color: var(--gray-500);
        }
        .report-row.total-row {
            font-weight: 600;
            color: var(--gray-900);
            border-bottom: none;
            padding-top: 1rem;
        }
        .report-row.highlight {
            background: var(--gray-50);
            padding: 1rem;
            border-radius: 6px;
            margin-top: 0.5rem;
        }
        .report-row.highlight.green { color: var(--emerald-600); }
        .report-row.highlight.red { color: var(--rose-600); }
        
        .report-grand-total {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--gray-900);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .report-grand-total.positive { background: var(--emerald-600); }
        .report-grand-total.negative { background: var(--rose-600); }

        @media print {
            body { background: white; }
            .sidebar, .topbar, .report-controls, .back-to-landing, .sidebar-overlay { display: none !important; }
            .dashboard-wrapper, .main-content, .content-area { padding: 0 !important; margin: 0 !important; height: auto !important; }
            .report-container { box-shadow: none; max-width: 100%; margin: 0; padding: 0; }
        }
    </style>
</head>
<body>
<div class="dashboard-wrapper">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i data-lucide="boxes" class="logo-icon"></i>
            <span class="logo-text">SupplierPro</span>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-group-label">Utama</div>
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="dashboard.html" class="nav-item"><i data-lucide="shopping-cart"></i> Order / Kasir</a>
            </div>
            <div class="nav-group">
                <div class="nav-group-label">Keuangan</div>
                <a href="dashboard.html" class="nav-item"><i data-lucide="arrow-right-left"></i> Arus Kas</a>
                <a href="laporan-laba-rugi.html" class="nav-item active"><i data-lucide="trending-up"></i> Laba Rugi</a>
            </div>
        </nav>

        <a href="index.html" class="back-to-landing">
            <i data-lucide="arrow-left"></i> Kembali ke Landing Page
        </a>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <div class="topbar-title">Laporan Laba Rugi</div>
            </div>
        </header>

        <div class="content-area" style="overflow-y: auto;">
            <div class="report-container">
                <div class="report-controls">
                    <div class="report-filters">
                        <select id="filter-bulan" class="form-input" style="width: auto;">
                            <option value="1">Januari</option>
                            <option value="2">Februari</option>
                            <option value="3">Maret</option>
                            <option value="4">April</option>
                            <option value="5">Mei</option>
                            <option value="6">Juni</option>
                            <option value="7">Juli</option>
                            <option value="8">Agustus</option>
                            <option value="9">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                        <select id="filter-tahun" class="form-input" style="width: auto;">
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                        </select>
                        <button class="btn-toolbar primary" onclick="loadReport()">Tampilkan</button>
                    </div>
                    <button class="btn-toolbar secondary" onclick="window.print()">
                        <i data-lucide="printer"></i> Cetak / Export PDF
                    </button>
                </div>

                <div class="report-header">
                    <div class="report-title">Laporan Laba Rugi</div>
                    <div class="report-subtitle" id="report-period">Periode: -</div>
                </div>

                <div id="report-content">
                    <div style="text-align:center; padding: 3rem; color: var(--gray-400);">
                        Memuat data...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    // Default to current month/year
    const today = new Date();
    document.getElementById('filter-bulan').value = today.getMonth() + 1;
    document.getElementById('filter-tahun').value = today.getFullYear();

    const rp = (num) => 'Rp ' + Number(num || 0).toLocaleString('id-ID');

    async function loadReport() {
        const bulan = document.getElementById('filter-bulan').value;
        const tahun = document.getElementById('filter-tahun').value;
        const token = localStorage.getItem('token');

        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        document.getElementById('report-period').innerText = `Periode: ${monthNames[bulan-1]} ${tahun}`;

        document.getElementById('report-content').innerHTML = '<div style="text-align:center; padding: 2rem;">Memuat...</div>';

        try {
            const response = await fetch(`/api/laporan/laba-rugi?bulan=${bulan}&tahun=${tahun}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const res = await response.json();
            
            if (!res.success) throw new Error(res.error || 'Gagal memuat data');

            const d = res.data;
            const rincianBebanHtml = d.operasional.rincian.length > 0 
                ? d.operasional.rincian.map(r => `<div class="report-row sub-row"><span>${r.category}</span><span>${rp(r.total)}</span></div>`).join('')
                : `<div class="report-row sub-row"><span>Tidak ada beban tercatat</span><span>Rp 0</span></div>`;

            const html = `
                <!-- 1. PENDAPATAN -->
                <div class="report-section">
                    <div class="report-section-title">Pendapatan</div>
                    <div class="report-row">
                        <span>Penjualan Kotor</span>
                        <span>${rp(d.pendapatan.kotor)}</span>
                    </div>
                    <div class="report-row sub-row">
                        <span>Dikurangi: Retur & Diskon</span>
                        <span>- ${rp(d.pendapatan.diskon)}</span>
                    </div>
                    <div class="report-row total-row">
                        <span>Penjualan Bersih</span>
                        <span>${rp(d.pendapatan.bersih)}</span>
                    </div>
                </div>

                <!-- 2. HPP -->
                <div class="report-section">
                    <div class="report-section-title">Harga Pokok Penjualan (HPP)</div>
                    <div class="report-row">
                        <span>Total Pembelian / HPP</span>
                        <span>${rp(d.hpp)}</span>
                    </div>
                </div>

                <!-- LABA KOTOR -->
                <div class="report-row highlight ${d.labaKotor >= 0 ? 'green' : 'red'}" style="margin-bottom: 1.5rem;">
                    <span style="font-weight:700; font-size:1.1rem;">Laba Kotor</span>
                    <span style="font-weight:700; font-size:1.1rem;">${rp(d.labaKotor)}</span>
                </div>

                <!-- 3. BEBAN OPERASIONAL -->
                <div class="report-section">
                    <div class="report-section-title">Beban Operasional</div>
                    ${rincianBebanHtml}
                    <div class="report-row total-row">
                        <span>Total Beban Operasional</span>
                        <span>${rp(d.operasional.total)}</span>
                    </div>
                </div>

                <!-- LABA OPERASIONAL -->
                <div class="report-row highlight ${d.labaOperasional >= 0 ? 'green' : 'red'}" style="margin-bottom: 1.5rem;">
                    <span style="font-weight:700; font-size:1.1rem;">Laba Operasional</span>
                    <span style="font-weight:700; font-size:1.1rem;">${rp(d.labaOperasional)}</span>
                </div>

                <!-- 4. PENDAPATAN LAIN-LAIN -->
                <div class="report-section">
                    <div class="report-section-title">Pendapatan Lain-lain</div>
                    <div class="report-row">
                        <span>Pendapatan di luar usaha</span>
                        <span>${rp(d.pendapatanLain)}</span>
                    </div>
                </div>

                <!-- LABA BERSIH -->
                <div class="report-grand-total ${d.labaBersih >= 0 ? 'positive' : 'negative'}">
                    <span>${d.labaBersih >= 0 ? 'LABA BERSIH' : 'RUGI BERSIH'}</span>
                    <span>${rp(d.labaBersih)}</span>
                </div>
            `;
            
            document.getElementById('report-content').innerHTML = html;
        } catch (err) {
            document.getElementById('report-content').innerHTML = `<div style="text-align:center; padding: 2rem; color: red;">${err.message}</div>`;
        }
    }

    // Load initial data
    loadReport();
</script>
</body>
</html>
